deps.neo_compat = "[21.3.56,)"
deps.neo_loader = "21.3.76"
deps.kotlin_forge = "5.12.0"

[neoforge."1.21.4"]
mod.mc_compat = "[1.21.4]"
deps.neo_compat = "[21.4.121,)"
deps.neo_loader = "21.4.137"
deps.kotlin_forge = "5.12.0"

[neoforge."1.21.5"]
mod.mc_compat = "[1.21.5]"
deps.neo_compat = "[21.5.74,)"
deps.neo_loader = "21.5.75"
deps.kotlin_forge = "5.12.0"

[neoforge."26.1.2"]
