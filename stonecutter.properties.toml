# Shared and per-version/per-loader properties, see
# https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
#
# Each key is defined at exactly one level: shared (top), per Minecraft version
# (["x"]) or per loader and version ([loader."x"]).
mod.id = "wingedsandals"
mod.name = "WingedSandals"
mod.group = "com.adilhanney.wingedsandals"
mod.version = "1.0.5"

deps.fabric_loader = "0.19.3"
deps.fabric_kotlin = "1.13.12+kotlin.2.4.0"

# Per Minecraft version:
# - mod.mc_label: range shown in the jar file name
# - mod.mc_releases: releases to be marked compatible on Modrinth/Curseforge
# - deps.java: Java version required by this Minecraft version

["1.20.1"]
mod.mc_label = "1.20-1.20.4"
mod.mc_releases = ["1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4"]
deps.java = 17

["1.20.5"]
mod.mc_label = "1.20.5-1.20.6"
mod.mc_releases = ["1.20.5", "1.20.6"]
deps.java = 21

["1.21.1"]
mod.mc_label = "1.21-1.21.1"
mod.mc_releases = ["1.21", "1.21.1"]
deps.java = 21

["1.21.2"]
mod.mc_label = "1.21.2-1.21.3"
mod.mc_releases = ["1.21.2", "1.21.3"]
deps.java = 21

["1.21.4"]
mod.mc_label = "1.21.4"
mod.mc_releases = ["1.21.4"]
deps.java = 21

["1.21.5"]
mod.mc_label = "1.21.5"
mod.mc_releases = ["1.21.5"]
deps.java = 21

["26.1.2"]
mod.mc_label = "26.1.2"
mod.mc_releases = ["26.1.2"]
deps.java = 25

# Fabric, per Minecraft version:
# - mod.mc_compat: compatibility range in fabric.mod.json
# - deps.fabric_loader_min: oldest Fabric Loader the jar accepts
# - deps.fabric_api: check this on https://fabricmc.net/develop

[fabric."1.20.1"]
mod.mc_compat = ">=1.20 <1.20.5"
deps.fabric_loader_min = "0.16.0"
deps.fabric_api = "0.92.5+1.20.1"

[fabric."1.20.5"]
mod.mc_compat = ">=1.20.5 <1.21"
deps.fabric_loader_min = "0.16.0"
deps.fabric_api = "0.97.8+1.20.5"

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <1.21.2"
deps.fabric_loader_min = "0.16.0"
deps.fabric_api = "0.115.6+1.21.1"

[fabric."1.21.2"]
mod.mc_compat = ">=1.21.2 <1.21.4"
deps.fabric_loader_min = "0.16.0"
deps.fabric_api = "0.106.1+1.21.2"

[fabric."1.21.4"]
mod.mc_compat = ">=1.21.4 <1.21.5"
deps.fabric_loader_min = "0.16.0"
deps.fabric_api = "0.119.2+1.21.4"

[fabric."1.21.5"]
mod.mc_compat = ">=1.21.5 <1.22"
deps.fabric_loader_min = "0.16.0"
deps.fabric_api = "0.124.0+1.21.5"

[fabric."26.1.2"]
# ~26.1.2 means >=26.1.2 <26.2
mod.mc_compat = "~26.1.2"
deps.fabric_loader_min = "0.19.0"
deps.fabric_api = "0.145.4+26.1.2"
